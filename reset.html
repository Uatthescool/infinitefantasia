<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>New Password · Infinite Fantasia</title>
<style>
  @font-face {
    font-family: "NeoDunggeunmo";
    src: url("fonts/NeoDunggeunmoPro-Regular.ttf") format("truetype");
    font-display: swap;
  }
  :root {
    --ink: #452b1a;
    --muted-ink: #735943;
    --cream: #f7ebd1;
    --parchment: #f1e2bf;
    --parchment-edge: #b8925c;
    --night: #1b1820;
    --red: #8c2a1f;
    --red-light: #b33a2c;
    --gold: #e0b354;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--night); }
  body {
    margin: 0;
    color: var(--cream);
    font-family: "NeoDunggeunmo", "Courier New", monospace;
    font-size: 17px;
    line-height: 1.5;
  }
  a { color: var(--gold); }
  .wrap { max-width: 520px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: clamp(26px, 6vw, 34px); font-weight: normal; margin: 0 0 20px; letter-spacing: 1px; }
  .card { background: var(--parchment); color: var(--ink); border: 3px solid var(--parchment-edge); padding: 20px 24px; }
  label { display: block; margin: 0 0 4px; color: var(--muted-ink); }
  input {
    width: 100%;
    font: inherit;
    padding: 8px 10px;
    margin: 0 0 14px;
    background: #fffaf0;
    color: var(--ink);
    border: 2px solid var(--parchment-edge);
  }
  button {
    font: inherit;
    background: var(--red);
    color: var(--cream);
    border: 3px solid var(--gold);
    padding: 8px 24px;
    cursor: pointer;
  }
  button:hover, button:focus-visible { background: var(--red-light); }
  button:disabled { opacity: 0.6; cursor: default; }
  #message { margin: 14px 0 0; min-height: 1.5em; }
  .back { display: inline-block; margin-top: 20px; }
  [hidden] { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>NEW PASSWORD</h1>
  <div class="card">
    <form id="form" hidden>
      <label for="password">New password</label>
      <input id="password" type="password" autocomplete="new-password" minlength="6" required>
      <label for="again">Type it again</label>
      <input id="again" type="password" autocomplete="new-password" minlength="6" required>
      <button id="save" type="submit">SAVE PASSWORD</button>
    </form>
    <p id="message"></p>
  </div>
  <a class="back" href="./">Back to Infinite Fantasia</a>
</div>
<script>
  // Infinite Fantasia password reset (ledger IF-META-008). The game asks
  // Supabase to email a link; the link signs the player in for a moment and
  // lands here with that sign-in in the address's #fragment. This page uses
  // it once to set the new password. Only the game's publishable key is here.
  const URL_BASE = "https://qoslxjearmfabxdydiur.supabase.co";
  const KEY = "sb_publishable_rKDdJtaWZR-vIyFAJLRl3w_-FVBEt0j";

  const form = document.getElementById("form");
  const message = document.getElementById("message");
  const params = new URLSearchParams(location.hash.slice(1));
  const token = params.get("access_token");
  // Keep the sign-in out of the address bar and history.
  if (location.hash) history.replaceState(null, "", location.pathname);

  if (params.get("error")) {
    message.textContent = params.get("error_code") === "otp_expired"
      ? "This link has expired or was already used. Ask the game for a new one (Log In, then Forgot Password)."
      : "This link didn't work: " + (params.get("error_description") || params.get("error")).replace(/\+/g, " ");
  } else if (!token || params.get("type") !== "recovery") {
    message.textContent = "Open this page from the link in your password reset email. To get one, choose Log In, then Forgot Password in the game.";
  } else {
    form.hidden = false;
    document.getElementById("password").focus();
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const password = document.getElementById("password").value;
    if (password.length < 6) { message.textContent = "A password is at least 6 characters."; return; }
    if (password !== document.getElementById("again").value) { message.textContent = "The two passwords don't match."; return; }
    const save = document.getElementById("save");
    save.disabled = true;
    message.textContent = "Saving...";
    try {
      const answer = await fetch(URL_BASE + "/auth/v1/user", {
        method: "PUT",
        headers: { "apikey": KEY, "Authorization": "Bearer " + token, "Content-Type": "application/json" },
        body: JSON.stringify({ password }),
      });
      const data = await answer.json().catch(() => ({}));
      if (!answer.ok) throw new Error(data.msg || data.error_description || data.message || "The server said no.");
      form.hidden = true;
      message.textContent = "Your password is saved. Log in with it in the game.";
    } catch (error) {
      save.disabled = false;
      message.textContent = "Couldn't save it: " + error.message;
    }
  });
</script>
</body>
</html>
